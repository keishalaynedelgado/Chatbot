<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Synthie AI - Chat</title>
  
  <!-- Tailwind CSS CDN with plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Google Fonts & Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
  
  <!-- Marked.js for fast Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Tailwind Theme Configuration matching UI/DESIGN.md -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-tertiary-fixed": "#351000",
            "on-primary-fixed": "#0f0069",
            "surface-container-high": "#dce9ff",
            "on-primary": "#ffffff",
            "secondary-fixed-dim": "#c0c1ff",
            "secondary-container": "#6063ee",
            "surface-tint": "#544fc0",
            "background": "#f8f9ff",
            "surface-bright": "#f8f9ff",
            "surface": "#f8f9ff",
            "on-error-container": "#93000a",
            "tertiary-fixed-dim": "#ffb694",
            "tertiary-container": "#752c00",
            "primary-fixed": "#e2dfff",
            "surface-dim": "#ccdbf3",
            "inverse-surface": "#233144",
            "inverse-primary": "#c3c0ff",
            "on-background": "#0d1c2e",
            "surface-container-lowest": "#ffffff",
            "on-surface-variant": "#464553",
            "secondary": "#4648d4",
            "tertiary-fixed": "#ffdbcc",
            "primary-container": "#3730a3",
            "error": "#ba1a1a",
            "on-primary-fixed-variant": "#3b35a7",
            "primary": "#1f108e",
            "on-surface": "#0d1c2e",
            "surface-container-low": "#eff4ff",
            "on-secondary": "#ffffff",
            "on-tertiary-container": "#fe9562",
            "error-container": "#ffdad6",
            "inverse-on-surface": "#eaf1ff",
            "surface-container-highest": "#d5e3fc",
            "on-tertiary-fixed-variant": "#7a3003",
            "outline": "#777584",
            "on-primary-container": "#a9a7ff",
            "on-secondary-fixed": "#07006c",
            "on-secondary-fixed-variant": "#2f2ebe",
            "secondary-fixed": "#e1e0ff",
            "on-error": "#ffffff",
            "outline-variant": "#c8c4d5",
            "tertiary": "#511c00",
            "primary-fixed-dim": "#c3c0ff",
            "surface-variant": "#d5e3fc",
            "surface-container": "#e6eeff",
            "on-secondary-container": "#fffbff",
            "on-tertiary": "#ffffff"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "edge-margin-mobile": "1rem",
            "container-max": "800px",
            "section-margin": "2rem",
            "edge-margin-desktop": "2rem",
            "stack-gap": "1.5rem",
            "bubble-padding": "1rem 1.25rem"
          },
          "fontFamily": {
            "body-md": ["Inter", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "label-md": ["Inter", "sans-serif"],
            "mono-streaming": ["JetBrains Mono", "monospace"],
            "headline-md": ["Inter", "sans-serif"],
            "headline-lg": ["Inter", "sans-serif"],
            "body-lg": ["Inter", "sans-serif"]
          },
          "fontSize": {
            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
            "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
            "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500"}],
            "mono-streaming": ["15px", {"lineHeight": "24px", "fontWeight": "400"}],
            "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
            "headline-lg": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
            "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
          }
        }
      }
    };
  </script>
  
  <link rel="stylesheet" href="/css/custom.css"/>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased selection:bg-primary-fixed selection:text-primary">

  <!-- TopAppBar -->
  <header class="bg-background dark:bg-background top-0 flex justify-between items-center h-16 px-edge-margin-mobile md:px-edge-margin-desktop w-full border-b border-outline-variant dark:border-outline z-50 fixed backdrop-blur-md bg-opacity-95 dark:bg-opacity-95">
    <div class="flex items-center gap-3">
      <!-- Mobile hamburger menu button -->
      <button id="mobile-menu-toggle" class="md:hidden p-2 text-on-surface-variant hover:text-primary rounded-lg hover:bg-surface-container-low transition-colors" title="Toggle Menu">
        <span class="material-symbols-outlined text-2xl">menu</span>
      </button>
      <div class="font-headline-md text-headline-md font-semibold text-primary dark:text-primary-fixed-dim tracking-tight flex items-center gap-2 cursor-pointer" onclick="window.app.newChat()">
        <span>Synthie</span>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <!-- Settings trigger button -->
      <button onclick="Modals.openSettings()" class="p-2 text-on-surface-variant hover:text-primary hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors rounded-full" title="Settings">
        <span class="material-symbols-outlined text-[22px]">settings</span>
      </button>
      <!-- Profile/User avatar button -->
      <button onclick="Modals.openSettings()" class="flex items-center text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-all rounded-full p-1 cursor-pointer active:scale-95" title="User Profile">
        <span class="material-symbols-outlined text-3xl">account_circle</span>
      </button>
    </div>
  </header>

  <div class="flex flex-1 pt-16 overflow-hidden">
    <!-- Backdrop for mobile drawer -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-xs z-40 hidden md:hidden"></div>

    <!-- SideNavBar -->
    <nav id="sidebar-nav" class="fixed md:fixed top-16 left-0 h-[calc(100vh-4rem)] w-64 py-6 px-4 flex flex-col gap-4 bg-surface-container-low dark:bg-inverse-surface border-r border-outline-variant dark:border-outline z-40 transform -translate-x-full md:translate-x-0 drawer-transition">
      <div class="mb-4">
        <div class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Synthie AI</div>
        <div class="font-body-sm text-body-sm text-on-surface-variant dark:text-on-surface-variant flex items-center gap-1.5 mt-0.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 status-pulse"></span>
          <span>Online</span>
        </div>
      </div>

      <!-- New Chat Button -->
      <button id="new-chat-btn" onclick="window.app.newChat()" class="bg-primary text-on-primary rounded-lg py-2.5 px-4 font-label-md text-label-md hover:bg-primary/90 transition-all flex items-center justify-center gap-2 shadow-sm active:scale-98">
        <span class="material-symbols-outlined text-[18px]">add</span>
        <span>New Chat</span>
      </button>

      <!-- Navigation Links -->
      <div class="flex flex-col gap-1.5 flex-1 overflow-y-auto">
        <a class="flex items-center gap-3 px-3 py-2 text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-variant transition-all duration-200 rounded-lg active:scale-95" href="javascript:void(0)" onclick="Modals.openHistory()">
          <span class="material-symbols-outlined text-[20px]">history</span>
          <span class="font-label-md text-label-md">History</span>
        </a>
        <a class="flex items-center gap-3 px-3 py-2 text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-variant transition-all duration-200 rounded-lg active:scale-95" href="javascript:void(0)" onclick="Modals.openFAQs()">
          <span class="material-symbols-outlined text-[20px]">quiz</span>
          <span class="font-label-md text-label-md">FAQs</span>
        </a>
        <a class="flex items-center gap-3 px-3 py-2 text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-variant transition-all duration-200 rounded-lg active:scale-95" href="javascript:void(0)" onclick="Modals.openHumanAgent()">
          <span class="material-symbols-outlined text-[20px]">support_agent</span>
          <span class="font-label-md text-label-md">Human Agent</span>
        </a>
        <a class="flex items-center gap-3 px-3 py-2 bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-lg font-bold hover:opacity-95 transition-all duration-200 active:scale-95" href="javascript:void(0)" onclick="Modals.openSettings()">
          <span class="material-symbols-outlined text-[20px]">settings</span>
          <span class="font-label-md text-label-md">Settings</span>
        </a>
      </div>

      <!-- Bottom SideNav Links -->
      <div class="mt-auto flex flex-col gap-1 pt-3 border-t border-outline-variant/60">
        <a class="flex items-center gap-3 px-3 py-1.5 text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-variant transition-all duration-200 rounded-lg text-xs active:scale-95" href="javascript:void(0)" onclick="Modals.openFAQs()">
          <span class="material-symbols-outlined text-[18px]">gavel</span>
          <span class="font-label-md">Privacy</span>
        </a>
        <a class="flex items-center gap-3 px-3 py-1.5 text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-variant transition-all duration-200 rounded-lg text-xs active:scale-95" href="javascript:void(0)" onclick="Modals.openFAQs()">
          <span class="material-symbols-outlined text-[18px]">description</span>
          <span class="font-label-md">Terms</span>
        </a>
      </div>
    </nav>

    <!-- Main Chat Area -->
    <main class="flex-1 ml-0 md:ml-64 flex flex-col h-[calc(100vh-4rem)] relative w-full">
      
      <!-- System Error / Offline Banner (Dynamic) -->
      <div id="system-banner" class="hidden w-full bg-error-container text-on-error-container py-2 px-4 text-center font-body-sm text-body-sm flex justify-center items-center gap-2 shadow-xs transition-all">
        <span class="material-symbols-outlined text-sm">warning</span>
        <span class="banner-text">Network connection unstable. Some messages may fail to send.</span>
        <button onclick="document.getElementById('system-banner').classList.add('hidden')" class="ml-2 hover:opacity-75">
          <span class="material-symbols-outlined text-sm">close</span>
        </button>
      </div>

      <!-- Chat Scroll Area -->
      <div id="chat-scroll-area" class="flex-1 overflow-y-auto px-edge-margin-mobile md:px-edge-margin-desktop py-section-margin flex flex-col items-center">
        <div id="message-list" class="w-full max-w-container-max flex flex-col gap-stack-gap">
          <!-- Messages will be rendered here dynamically -->
        </div>
      </div>

      <!-- Input Area Docked at bottom -->
      <div class="w-full px-edge-margin-mobile md:px-edge-margin-desktop py-4 bg-background/80 dark:bg-background/80 backdrop-blur-md border-t border-outline-variant dark:border-outline flex flex-col items-center z-20">
        <div class="w-full max-w-container-max flex flex-col gap-2">
          
          <!-- Attachment Chips Preview Container -->
          <div id="attachment-previews" class="hidden flex flex-wrap gap-2 px-1"></div>

          <!-- Input Bar Container -->
          <div class="w-full relative shadow-[0px_4px_20px_rgba(0,0,0,0.05)] rounded-xl bg-surface-container-lowest dark:bg-inverse-surface border border-outline-variant dark:border-outline p-2 flex items-end gap-2 transition-all focus-within:border-primary">
            <!-- Hidden File Input -->
            <input type="file" id="file-upload-input" multiple class="hidden"/>
            
            <!-- Attachment Button -->
            <button type="button" id="attach-file-btn" class="p-2 text-outline hover:text-primary transition-colors rounded-full hover:bg-surface-container-low dark:hover:bg-surface-variant flex-shrink-0" title="Attach file">
              <span class="material-symbols-outlined text-[20px]">attach_file</span>
            </button>

            <!-- Textarea -->
            <textarea id="chat-input" class="w-full bg-transparent border-none focus:ring-0 resize-none font-body-md text-body-md py-2 placeholder:text-outline-variant text-on-surface dark:text-inverse-on-surface max-h-32 focus:outline-none" placeholder="Message Synthie AI..." rows="1"></textarea>

            <!-- Send / Stop Button -->
            <button id="send-btn" type="button" class="p-2 bg-primary text-on-primary rounded-lg hover:bg-primary/90 transition-all flex-shrink-0 shadow-sm active:scale-95" title="Send message">
              <span id="send-icon" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
            </button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Footer -->
  <footer class="bg-background dark:bg-background full-width bottom-0 border-t border-outline-variant dark:border-outline flex flex-col md:flex-row justify-between items-center py-3 px-edge-margin-mobile md:px-edge-margin-desktop w-full max-w-container-max mx-auto z-30 relative ml-0 md:ml-64 md:w-[calc(100%-16rem)]">
    <div class="font-body-sm text-body-sm text-on-surface-variant dark:text-on-surface-variant mb-2 md:mb-0 text-xs">
      © 2026 Synthie AI. All rights reserved.
    </div>
    <div class="flex gap-4">
      <a class="font-body-sm text-body-sm text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim opacity-80 hover:opacity-100 transition-opacity text-xs" href="javascript:void(0)" onclick="Modals.openFAQs()">Privacy Policy</a>
      <a class="font-body-sm text-body-sm text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim opacity-80 hover:opacity-100 transition-opacity text-xs" href="javascript:void(0)" onclick="Modals.openFAQs()">Terms of Service</a>
      <a class="font-body-sm text-body-sm text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim opacity-80 hover:opacity-100 transition-opacity text-xs" href="javascript:void(0)" onclick="Modals.openFAQs()">Help Center</a>
    </div>
  </footer>

  <!-- Modal Container Dynamic Host -->
  <div id="modal-container" class="hidden"></div>

  <!-- Application Scripts -->
  <script src="/js/config.js"></script>
  <script src="/js/utils/helpers.js"></script>
  <script src="/js/utils/markdown.js"></script>
  <script src="/js/chat/storage.js"></script>
  <script src="/js/chat/chat-manager.js"></script>
  <script src="/js/ai/builtin-engine.js"></script>
  <script src="/js/ai/nvidia-client.js"></script>
  <script src="/js/ai/gemini-client.js"></script>
  <script src="/js/ai/openai-client.js"></script>
  <script src="/js/ai/ai-service.js"></script>
  <script src="/js/ui/ui-renderer.js"></script>
  <script src="/js/ui/modals.js"></script>
  <script src="/js/ui/event-handlers.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
